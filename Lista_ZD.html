<!DOCTYPE html>
<html lang="pl-PL">
<head>
	<title>Strona Yevhenii - Projektowanie Stron Internotowych </title>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="with=device-with, initial-scale=1.0"/>
	<style type="text/css">
ul.a, ul.a li.a {
	display:block;
	list-style:none;
	margin:0;
	padding:0;
	width: 180px;
	}
	ul.a a:link, ul.a a:visited {
	display:block;
	width:170px;
	background-color: navy;
	color: white;
	text-decoration: none;
	padding: 6px 3px 3px 6px;
	border: 2px outset blue;
	}
	ul.a a:hover {
	color:yellow;
	text-decoration: none;
	padding: 6px 3px 3px 6px;
	border: 2px inset yellow;
	}
</style>
</head>
 <body>
<ul class="a">
	<li><a href="#">ONET</a></li>
	<li><a href="#">WP</a></li>
	<li><a href="#">INTERIA</a></li>
</ul>
</body>

</html>
