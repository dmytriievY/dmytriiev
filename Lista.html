	<style type="text/css">
ul.a, ul.a li.a {
	display:block;
	list-style:none;
	margin:0;
	padding:0;
	width: 180px;
	}
	ul.a a:link, ul.a a:visited {
	display:block;
	width:170px;
	background-color: navy;
	color: white;
	text-decoration: none;
	padding: 6px 3px 3px 6px;
	border: 2px outset blue;
	}
	ul.a a:hover {
	color:yellow;

	ul.be,ul.be li.be {

	list-style: none;

	padding: 0; 
	width: 180px;
	}
	ul.be a:link, ul.be a:visited 	{
	display: block;

	text-align:center;
	font-family: ravie;
	background-color: navy; 
	color: white; 
	padding: 6px 3px 3px 6px;
	border: 2px outset blue;
	border-radius:18px;
	text-decoration: none;
	margin:5px 0;
	}
	ul.be a:hover {
	color: yellow; 
	padding: 6px 3px 3px 6px;
	border: 2px inset yellow;
	text-decoration: none;
	transition: transform .9s ease-in;
	position: relative;
	left: 5px;
	}

	left: 5px;

	ul.d, ul.d li.d 	{
	display: block;

	margin: 0; 
	padding: 0;
	}
	ul.d  li.d {

	white-space: nowrap; 
	margin: 0 6px;
	} 

	ul.d a:link, ul.d a:visited 	{
	text-decoration: none;
	background-color: purple; 
	color: white; 
	padding: 4px;
	border: 2px outset fuchsia; 
	}
	ul.d a:hover {
	color: pink; 
	padding: 6px 3px 3px 6px;
	border: 2px inset yellow;
	transition: transform .8s ease-in;
	}

	#blok li.de {
	list-style: none; 
	padding-bottom: 1px; 
	position: relative;
	}
	#blok, #blok ul {
	width: 140px;
	}
	#blok ul {
	position: absolute; 
	top: 0px; left: 160px; 
	padding-left: 1px; 
	visibility: hidden;
	}
	#blok > li.de:hover > ul { 
	visibility: visible; 
	width: auto; 
	height: auto;
	}
	ul, ul li.a {
	margin:0;
	paddig:0;
	}  
	#blok a, #blok > li.de:hover > li.de > a  {
	display: block; 
	font: 12px/30px verdena, sans-serif; 
	text-decoration: none;
	padding: 0 10px; 
	width: 140px; 
	color: black; 
	background-color: gray;
	}
	#blok li.de:hover > a, #blok > li.d:hover > li.d:hover > a { 
	background-color: #333; 
	color:white; 
	}
	* {
	box-sizing: border-box;
	padding:0;
	margin:0;
	}
	ul.pozflex {
	display:flex;
	justify-content: space-evenly;
	flex-wrap:wrap;
	align-items: center;
	margin-top:10px;
	height:50px;
	list-style-type:none;
	}
	li.pozflex a.pozflex {
	display:block;
	width:300px;
	padding:15px;
	text-decoration: none;
	color: black;
	border:1px solid black;
	transition:.3s;
	text-align: center;
	}
	li.pozflex a.pozflex:hover {
	background-color:gray;
	color:#fff;
	}
