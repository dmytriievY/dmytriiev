<!DOCTYPE html>
<html lang="pl-PL">
<head>
	<title>Strona Yevhenii - Projektowanie Stron Internotowych </title>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="with=device-with, initial-scale=1.0"/>
	<style type="text/css">
ul.a, ul.a li.a {
	display:block;
	list-style:none;
	margin:0;
	padding:0;
	width: 180px;
	}
	ul.a a:link, ul.a a:visited {
	display:block;
	width:170px;
	background-color: navy;
	color: white;
	text-decoration: none;
	padding: 6px 3px 3px 6px;
	border: 2px outset blue;
	}
	ul.a a:hover {
	color:yellow;
	text-decoration: none;
	padding: 6px 3px 3px 6px;
	border: 2px inset yellow;
	}
	ul.ce a.link, ul.ce a:visited {
	display:block;
	text-align:center;
	font-family: ravie;
	background-color: navy;
	color: white;
	padding: 6px 3px 3px 6px;
	border:2px outset blue;
	border-radius:18px;
	text-decoration: none;
	margin:5px 0;
	}
	ul.ce a:hover {
	color:yellow;
	padding: 6px 3px 3px 6px;
	border: 2px inset yellow;
	text-decoration: none;
	transition: transform .8s ease-in;
	position: relative;
	left: 5px;
	width: 160px;
	}
	ul.ce li.ce {
	display:block;
	list-style: none;
	width:180px;
	}
	ul.trzy a.link, ul.trzy a:visited {
	display:block;
	text-align:center;
	font-family: ravie;
	background-color: navy;
	color: white;
	padding: 6px 3px 3px 6px;
	border:2px outset blue;
	border-radius:18px;
	text-decoration: none;
	margin:5px 0;
	}
	ul.trzy a:hover {
	color:yellow;
	padding: 6px 3px 3px 6px;
	border: 2px inset yellow;
	text-decoration: none;
	transition: transform .8s ease-in;
	position: relative;
	left: 5px;
	width: 160px;
	}
	ul.trzy li.trzy {
	display:block;
	list-style: none;
	width:180px;
	}
</style>
</head>
 <body>
<ul class="a">
	<li><a href="#">ONET</a></li>
	<li><a href="#">WP</a></li>
	<li><a href="#">INTERIA</a></li>
</ul>
<ul class="ce">
	<li class="ce"><a href="#" class="link">ONET</a></li>
	<li class="ce"><a href="#" class="link">WP</a></li>
	<li class="ce"><a href="#" class="link">INTERIA</a></li>
</ul>
<ul class="trzy">
	<li class="trzy"><a href="#" class="link">ONET</a></li>
	<li class="trzy"><a href="#" class="link">WP</a></li>
	<li class="trzy"><a href="#" class="link">INTERIA</a></li>
</ul>
</body>

</html>
